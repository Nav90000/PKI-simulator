function ManagementPage({ certificates, onRevoke, onComplete, onNavigate }) {
  const [filter, setFilter] = useState('all');
  const [revokeModal, setRevokeModal] = useState(null);
  const [viewModal, setViewModal] = useState(null);

  const filtered = filter==='all' ? certificates : certificates.filter(c=>c.status===filter);
  useEffect(() => { onComplete(); }, []);

  const statusBadge = (s) => {
    if(s==='valid') return <span className="badge badge-success">VALID</span>;
    if(s==='expired') return <span className="badge badge-error">EXPIRED</span>;
    if(s==='revoked') return <span className="badge badge-error">REVOKED</span>;
    if(s==='pending') return <span className="badge badge-warn">PENDING</span>;
    return <span className="badge badge-info">{s}</span>;
  };

  return (
    <div className="fade-in">
      <div className="page-header">
        <div className="page-eyebrow">STAGE 9 • MANAGEMENT</div>
        <div className="page-title">Certificate Management</div>
        <div className="page-subtitle">View, validate, revoke, and manage all certificates in the PKI system.</div>
      </div>

      {/* Stats row */}
      <div className="grid-4" style={{marginBottom:'24px'}}>
        {[
          {label:'Total',value:certificates.length,color:'var(--accent)'},
          {label:'Valid',value:certificates.filter(c=>c.status==='valid').length,color:'var(--success)'},
          {label:'Expired',value:certificates.filter(c=>c.status==='expired').length,color:'var(--error)'},
          {label:'Revoked',value:certificates.filter(c=>c.status==='revoked').length,color:'var(--warn)'},
        ].map(s=>(
          <div key={s.label} className="stat-card" style={{textAlign:'center'}}>
            <div style={{fontSize:'28px',fontWeight:'800',color:s.color}}>{s.value}</div>
            <div style={{fontSize:'12px',color:'var(--text-dim)'}}>{s.label} Certificates</div>
          </div>
        ))}
      </div>

      {/* Filters */}
      <div style={{display:'flex',gap:'8px',marginBottom:'16px',flexWrap:'wrap'}}>
        {['all','valid','expired','revoked','pending'].map(f=>(
          <button key={f} className={filter===f?'btn-primary btn-sm':'btn-secondary btn-sm'} onClick={()=>setFilter(f)} style={{textTransform:'capitalize'}}>
            {f}
          </button>
        ))}
      </div>

      {/* Table */}
      <div className="card" style={{overflowX:'auto'}}>
        <table className="data-table">
          <thead>
            <tr>
              <th>Certificate</th><th>Issuer</th><th>Status</th><th>Valid From</th><th>Expires</th><th>Actions</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(c=>(
              <tr key={c.id}>
                <td>
                  <div style={{fontWeight:'600',color:'var(--text-primary)',fontSize:'13px'}}>{c.cn}</div>
                  <div style={{fontSize:'11px',color:'var(--text-dim)'}}>{c.org}</div>
                </td>
                <td>{c.issuer}</td>
                <td>{statusBadge(c.status)}</td>
                <td style={{fontSize:'12px'}}>{c.validFrom?dateStr(c.validFrom):'—'}</td>
                <td style={{fontSize:'12px'}}>{c.validTo?dateStr(c.validTo):'—'}</td>
                <td>
                  <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
                    <button className="btn-icon" title="View" onClick={()=>setViewModal(c)}>👁️</button>
                    <button className="btn-icon" title="Validate" onClick={()=>onNavigate('validation')}>✅</button>
                    {c.status==='valid' && (
                      <button className="btn-icon" title="Revoke" style={{color:'var(--error)'}} onClick={()=>setRevokeModal(c)}>🚫</button>
                    )}
                    {c.status==='expired' && (
                      <button className="btn-icon" title="Renew" style={{color:'var(--success)'}} onClick={()=>alert('Certificate renewal initiated (simulation).')}>🔄</button>

            ))}

        </table>

      {revokeModal && (
        <Modal
          title="🚫 Revoke Certificate"

          actions={
            <>
              <button className="btn-secondary btn-sm" onClick={()=>setRevokeModal(null)}>Cancel</button>
              <button className="btn-danger btn-sm" onClick={()=>{onRevoke(revokeModal.id);setRevokeModal(null);}}>Revoke Certificate</button>
            </>
          }
        >
          <p>Are you sure you want to revoke the certificate for <strong style={{color:'var(--accent)'}}>{revokeModal.cn}</strong>?</p>
          <p style={{marginTop:'8px'}}>This action will immediately invalidate the certificate and add it to the Certificate Revocation List (CRL). This cannot be undone.</p>
        </Modal>
      )}

      {viewModal && (
        <Modal
          title={`📜 Certificate: ${viewModal.cn}`}
          onClose={()=>setViewModal(null)}

            {l:'Common Name',v:viewModal.cn},{l:'Organization',v:viewModal.org},
            {l:'Issuer',v:viewModal.issuer},{l:'Status',v:viewModal.status.toUpperCase()},
            {l:'Serial',v:viewModal.serial},{l:'Valid From',v:viewModal.validFrom?dateStr(viewModal.validFrom):'—'},
            {l:'Expires',v:viewModal.validTo?dateStr(viewModal.validTo):'—'},
            {l:'Fingerprint',v:viewModal.fingerprint?.substring(0,32)+'...'},
          ].map(f=>(
            <div key={f.l} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid rgba(255,255,255,0.05)'}}>
              <span style={{fontSize:'12px',color:'var(--text-dim)'}}>{f.l}</span>
              <span style={{fontSize:'12px',color:'var(--text-secondary)',fontFamily:'monospace',maxWidth:'240px',textAlign:'right',wordBreak:'break-all'}}>{f.v}</span>
            </div>
          ))}
        </Modal>
      )}
    </div>
  );
}

// PAGE: Revocation
// ─────────────────────────────────────────────────────────────────────────────
function RevocationPage({ revocationStatus, onRevoke, onComplete, onNavigate }) {
  const [step, setStep] = useState(-1);
  const [reason, setReason] = useState('keyCompromise');
  const [modal, setModal] = useState(false);

  const reasons = {
    keyCompromise:'Private Key Compromised',
    incorrectIssuance:'Certificate Issued Incorrectly',
    orgChange:'Organization Changes',
    domainChange:'Domain Ownership Changes',
    securityIncident:'Security Incident',
  };

  const revokeSteps = [
    {label:'Certificate',icon:'📜',desc:'Currently valid certificate',state:revocationStatus==='revoked'?'done':'idle'},
    {label:'Revocation Request',icon:'📤',desc:'Request submitted to CA',state:step>=1?'done':step===0?'active':'idle'},
    {label:'CA Processing',icon:'🏛️',desc:'CA validates and processes request',state:step>=2?'done':step===1?'active':'idle'},
    {label:'Added to CRL',icon:'📋',desc:'Certificate added to Certificate Revocation List',state:step>=3?'done':step===2?'active':'idle'},
    {label:'Status: REVOKED',icon:'🚫',desc:'Certificate is now invalid',state:revocationStatus==='revoked'||step>=3?'done':'idle'},
  ];

  const handleRevoke = async () => {
    setModal(false);
    for (let i=0; i<4; i++) {
      setStep(i);
      await sleep(700);
    }
    onRevoke();
    onComplete();
    setStep(-1);
  };

  return (
    <div className="fade-in">
      <div className="page-header">
        <div className="page-eyebrow">STAGE 10 • REVOCATION</div>
        <div className="page-title">Certificate Revocation</div>
        <div className="page-subtitle">Understand when and why certificates are revoked, and how the Certificate Revocation List (CRL) works.</div>
      </div>

      {/* Why revoke */}
      <div className="card" style={{marginBottom:'24px'}}>
        <div style={{fontSize:'14px',fontWeight:'600',marginBottom:'16px',color:'var(--accent)'}}>⚠️ Why Certificates May Be Revoked</div>
        <div className="grid-3">
          {[
            {icon:'🔑',title:'Private Key Compromised',desc:'If the private key is stolen or leaked, the certificate must be immediately revoked.'},
            {icon:'❌',title:'Incorrect Issuance',desc:'If the CA issued the certificate with incorrect information or without proper verification.'},
            {icon:'🏢',title:'Organization Changes',desc:'Company name change, merger, dissolution, or domain transfer requires new certificates.'},
            {icon:'🌐',title:'Domain Ownership',desc:'If domain ownership changes hands, old certificates must be revoked.'},
            {icon:'⚠️',title:'Security Incident',desc:'Following a breach or attack that may have exposed the private key.'},
            {icon:'📋',title:'Policy Violation',desc:'Certificate was used in violation of the CA\'s certificate policy.'},
          ].map(r=>(
            <div key={r.title} style={{display:'flex',gap:'10px',alignItems:'flex-start',padding:'10px',background:'rgba(255,255,255,0.02)',borderRadius:'8px'}}>
              <div style={{fontSize:'20px',flexShrink:0}}>{r.icon}</div>
              <div>
                <div style={{fontSize:'12px',fontWeight:'600',color:'var(--text-primary)',marginBottom:'3px'}}>{r.title}</div>
                <div style={{fontSize:'11px',color:'var(--text-dim)',lineHeight:'1.5'}}>{r.desc}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Status + revoke */}
      <div className="grid-2" style={{marginBottom:'24px'}}>
        <div className="card">
          <div style={{fontSize:'14px',fontWeight:'600',marginBottom:'16px'}}>🎯 Certificate Under Review</div>
          <div style={{padding:'16px',background:revocationStatus==='revoked'?'rgba(255,61,113,0.06)':'rgba(0,230,118,0.06)',border:`1px solid ${revocationStatus==='revoked'?'rgba(255,61,113,0.25)':'rgba(0,230,118,0.25)'}`,borderRadius:'10px',textAlign:'center',marginBottom:'16px'}}>
            <div style={{fontSize:'18px',fontWeight:'800',color:revocationStatus==='revoked'?'var(--error)':'var(--success)'}}>
              {revocationStatus==='revoked'?'🚫 REVOKED':'✅ VALID'}
            </div>
            <div style={{fontSize:'12px',color:'var(--text-dim)',marginTop:'4px'}}>secure-demo.example</div>
          </div>

          {revocationStatus!=='revoked' && (
            <>
              <div className="form-group">
                <label className="form-label">REVOCATION REASON</label>
                <select className="form-select" value={reason} onChange={e=>setReason(e.target.value)}>
                  {Object.entries(reasons).map(([k,v])=><option key={k} value={k}>{v}</option>)}
                </select>
              </div>
              <button className="btn-danger" onClick={()=>setModal(true)}>🚫 Revoke Certificate</button>
            </>
          )}

          {revocationStatus==='revoked' && (
            <>
              <div className="info-panel" style={{borderLeftColor:'var(--error)',marginBottom:'12px'}}>
                <strong style={{color:'var(--error)'}}>Certificate Revoked</strong><br/>
                This certificate is now on the CRL and will fail all validation checks. Systems checking OCSP or downloading the CRL will be notified.
              </div>
              <button className="btn-secondary btn-sm" onClick={()=>onNavigate('validation')}>Test Validation (will fail) →</button>
            </>
          )}
        </div>

        {/* Flow */}
        <div className="card">
          <div style={{fontSize:'14px',fontWeight:'600',marginBottom:'16px',color:'var(--accent)'}}>📋 Revocation Process</div>
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'0'}}>
            {revokeSteps.map((s,i)=>(
              <React.Fragment key={i}>
                <div style={{display:'flex',alignItems:'center',gap:'12px',width:'100%',padding:'10px 0'}}>
                  <div style={{width:'32px',height:'32px',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,background:s.state==='done'?'rgba(0,230,118,0.15)':s.state==='active'?'rgba(0,180,255,0.1)':'rgba(255,255,255,0.04)',border:`1px solid ${s.state==='done'?'rgba(0,230,118,0.4)':s.state==='active'?'rgba(0,180,255,0.4)':'var(--border)'}`,fontSize:'14px'}}>
                    {s.state==='done'?'✓':s.icon}
                  </div>
                  <div>
                    <div style={{fontSize:'13px',fontWeight:'600',color:s.state==='done'?'var(--success)':s.state==='active'?'var(--accent)':'var(--text-dim)'}}>{s.label}</div>
                    <div style={{fontSize:'11px',color:'var(--text-dim)'}}>{s.desc}</div>
                  </div>
                </div>
                {i<revokeSteps.length-1 && <div style={{width:'2px',height:'16px',background:'var(--border)',marginLeft:'15px'}} />}
              </React.Fragment>
            ))}
          </div>
        </div>
      </div>

      {modal && (
        <Modal
          title="⚠️ Confirm Certificate Revocation"
          onClose={()=>setModal(false)}
          actions={
            <>
              <button className="btn-secondary btn-sm" onClick={()=>setModal(false)}>Cancel</button>
              <button className="btn-danger btn-sm" onClick={handleRevoke}>Yes, Revoke Certificate</button>
            </>
          }
        >
          <p>You are about to revoke the certificate for <strong style={{color:'var(--accent)'}}>secure-demo.example</strong>.</p>
          <p style={{marginTop:'8px'}}>Reason: <strong style={{color:'var(--warn)'}}>{reasons[reason]}</strong></p>
          <p style={{marginTop:'8px',color:'var(--error)'}}>This action will immediately add the certificate to the CRL and cannot be undone.</p>
        </Modal>
      )}
    </div>
  );
}

    {id:'keygen',num:1,title:'Generate Cryptographic Keys',desc:'Create an RSA key pair — public and private. Foundation of PKI identity.',page:'keygen'},
    {id:'csr',num:2,title:'Create Certificate Signing Request',desc:'Bundle your identity info and public key into a CSR for submission to the CA.',page:'csr'},
    {id:'ca',num:3,title:'Submit to Certificate Authority',desc:'Send your CSR to the trusted CA that will verify your identity.',page:'ca'},
    {id:'ca',num:4,title:'CA Verifies Request',desc:'The CA checks your identity, validates the CSR, and decides to issue or reject.',page:'ca'},
    {id:'certificate',num:5,title:'Certificate Issued',desc:'The CA signs your certificate. It is now a trusted identity credential.',page:'certificate'},
    {id:'certificate',num:6,title:'Certificate Installed',desc:'The certificate is deployed and ready for use in servers and applications.',page:'certificate'},
    {id:'validation',num:7,title:'Certificate Validated',desc:'Clients validate the certificate before trusting the server\'s identity.',page:'validation'},
    {id:'auth',num:8,title:'Identity Authenticated',desc:'Using PKI, the client proves its identity through challenge-response.',page:'auth'},
    {id:'communication',num:9,title:'Secure Communication',desc:'PKI enables encrypted, authenticated data exchange between parties.',page:'communication'},
    {id:'revocation',num:10,title:'Certificate Renewal / Revocation',desc:'Manage certificate lifecycle — renew before expiry, revoke if compromised.',page:'revocation'},
  ];

  useEffect(() => { onComplete(); }, []);

  return (
    <div className="fade-in">
      <div className="page-header">
        <div className="page-eyebrow">COMPLETE FLOW</div>
        <div className="page-title">PKI Journey</div>
        <div className="page-subtitle">The complete end-to-end Public Key Infrastructure workflow from identity to secure communication.</div>
      </div>

      <div style={{position:'relative'}}>
        {steps.map((s,i)=>{
          const done = progress[s.id];
          const isLast = i===steps.length-1;
          return (
            <div key={i} className="journey-item" onClick={()=>onNavigate(s.page)}>
              {!isLast && <div className={`journey-line ${done?'done':''}`} />}
              <div className={`journey-step-num ${done?'done':s.id===Object.keys(progress).find(k=>!progress[k])?'active':'pending'}`}>
                {done ? '✓' : s.num}
              </div>
              <div className="journey-content">
                <div className="journey-title">{s.title}</div>
                <div className="journey-desc">{s.desc}</div>
                <div className="journey-badge">
                  {done ? <span className="badge badge-success">✓ Completed</span> : <span className="badge badge-info">Click to navigate</span>}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {Object.values(progress).filter(Boolean).length === Object.keys(progress).length && (
        <div className="card fade-in" style={{marginTop:'24px',background:'rgba(0,230,118,0.04)',borderColor:'rgba(0,230,118,0.3)',textAlign:'center',padding:'28px'}}>
          <div style={{fontSize:'40px',marginBottom:'8px'}}>🎉</div>
          <div style={{fontSize:'20px',fontWeight:'700',color:'var(--success)',marginBottom:'8px'}}>PKI Journey Complete!</div>
          <div style={{fontSize:'13px',color:'var(--text-dim)',marginBottom:'16px'}}>You have successfully completed all stages of the PKI simulation.</div>
          <button className="btn-primary" onClick={()=>onNavigate('completion')}>View Completion Certificate →</button>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// PAGE: Completion
// ─────────────────────────────────────────────────────────────────────────────
function CompletionPage({ progress, keyPair, certificate, onReset, onNavigate }) {
  const achievements = [
    {done:progress.keygen, text:'Generated cryptographic key pair'},
    {done:progress.csr, text:'Created Certificate Signing Request'},
    {done:progress.ca, text:'Interacted with Certificate Authority'},
    {done:progress.certificate, text:'Issued digital certificate'},
    {done:progress.validation, text:'Validated certificate using PKI checks'},
    {done:progress.auth, text:'Verified identity through authentication'},
    {done:progress.communication, text:'Established secure encrypted communication'},
    {done:progress.securityLab, text:'Tested certificate failure scenarios'},
    {done:progress.revocation, text:'Simulated certificate revocation'},
  ];

  return (
    <div className="fade-in" style={{maxWidth:'700px',margin:'0 auto',textAlign:'center',padding:'20px 0'}}>
      <span className="completion-star">🏆</span>
      <div style={{fontSize:'32px',fontWeight:'800',color:'var(--success)',marginBottom:'6px',marginTop:'16px'}}>PKI SIMULATION COMPLETE ✓</div>
      <div style={{fontSize:'16px',color:'var(--accent)',marginBottom:'6px'}}>Trust Infrastructure Successfully Simulated</div>
      <div style={{fontSize:'13px',color:'var(--text-dim)',marginBottom:'32px',lineHeight:'1.7',maxWidth:'500px',margin:'0 auto 32px'}}>
        PKI establishes digital trust by connecting identities, cryptographic keys, certificates, and trusted authorities into a complete security ecosystem.
      </div>

      <div style={{textAlign:'left',marginBottom:'28px'}}>
        {achievements.map((a,i)=>(
          <div key={i} className="achievement-item" style={{animationDelay:`${i*0.08}s`}}>
            <span className="achievement-icon">{a.done?'✅':'⬜'}</span>
            <span className="achievement-text" style={{color:a.done?'var(--text-primary)':'var(--text-dim)'}}>{a.text}</span>
          </div>
        ))}
      </div>

      {/* Summary */}
      <div className="card" style={{textAlign:'left',marginBottom:'24px'}}>
        <div style={{fontSize:'14px',fontWeight:'600',color:'var(--accent)',marginBottom:'14px'}}>🔐 Concepts Mastered</div>
        <div className="grid-2">
          {['Public & Private Key Cryptography','Certificate Signing Requests (CSR)','Certificate Authority Operations','Digital Certificate Structure','Certificate Validation Process','Challenge-Response Authentication','TLS/Secure Communication Model','Certificate Revocation (CRL/OCSP)'].map(c=>(
            <div key={c} style={{display:'flex',gap:'8px',alignItems:'center',fontSize:'12px',color:'var(--text-secondary)'}}>
              <span style={{color:'var(--success)'}}>✓</span>{c}
            </div>
          ))}
        </div>
      </div>

      <div style={{display:'flex',gap:'12px',justifyContent:'center',flexWrap:'wrap'}}>
        <button className="btn-primary" onClick={onReset}>↺ Restart Simulation</button>
        <button className="btn-secondary" onClick={()=>onNavigate('journey')}>🗺️ Explore PKI Again</button>
        <button className="btn-secondary" onClick={()=>onNavigate('dashboard')}>📊 Dashboard</button>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// DEMO MODE
// ─────────────────────────────────────────────────────────────────────────────
async function runDemo(navigate, setData, sleep2) {
  const userInfo = { name:'Demo User', org:'PKI Academy', domain:'demo.example', email:'demo@pki.example' };
  const pub = genPublicKey();
  const priv = genPrivateKey();
  const keyPair = { publicKey:pub, privateKey:priv };
  const csr = {
    commonName:'demo.example', org:'PKI Academy', country:'IN',
    email:'demo@pki.example', domain:'demo.example',
    publicKeyFingerprint:genFingerprint(), timestamp:new Date().toISOString(),
    signature:randomHex(64).toUpperCase(),
  };
  const cert = {
    cn:'demo.example', org:'PKI Academy', country:'IN', email:'demo@pki.example',
    issuer:'PKI Learning Root CA', serial:genSerial(), validFrom:now(),
    validTo:addYear(now(),1), fingerprint:genFingerprint(),
    sigAlg:'SHA256withRSA', version:'V3',
    keyUsage:'Digital Signature, Key Encipherment',
    extKeyUsage:'TLS Web Server Authentication', status:'valid',
  };

  const steps = [
    ()=>{ navigate('keygen'); setData(p=>({...p, userInfo, keyPair, progress:{...p.progress,keygen:true}})); },
    ()=>{ navigate('csr'); setData(p=>({...p, csr, progress:{...p.progress,csr:true}})); },
    ()=>{ navigate('ca'); setData(p=>({...p, progress:{...p.progress,ca:true}})); },
    ()=>{ navigate('certificate'); setData(p=>({...p, certificate:cert, progress:{...p.progress,certificate:true}})); },
    ()=>{ navigate('validation'); setData(p=>({...p, progress:{...p.progress,validation:true}})); },
    ()=>{ navigate('auth'); setData(p=>({...p, progress:{...p.progress,auth:true}})); },
    ()=>{ navigate('communication'); setData(p=>({...p, progress:{...p.progress,communication:true}})); },
    ()=>{ navigate('completion'); },
  ];

  for (const fn of steps) {
    fn();
    await sleep2(2000);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// ROOT APP
// ─────────────────────────────────────────────────────────────────────────────
function App() {
  const [appState, setAppState] = useState(initState());
  const [showLoading, setShowLoading] = useState(true);
  const [pageLoading, setPageLoading] = useState(false);

  const navigate = useCallback(async (page) => {
    if (page === appState.currentPage) return;
    setPageLoading(true);
    await sleep(200);
    setAppState(p=>({...p, currentPage:page}));
    setPageLoading(false);
  }, [appState.currentPage]);

  const markComplete = (key) => setAppState(p=>({...p, progress:{...p.progress,[key]:true}}));

  const handleReset = () => {
    setAppState(initState());
    setShowLoading(true);
  };

  const trustStatus = appState.progress.certificate && appState.progress.validation ? 'established' : 'establishing';

  if (showLoading) {
    return <LoadingScreen onDone={()=>setShowLoading(false)} />;
  }

  if (appState.currentPage === 'landing') {
    return (
      <div style={{position:'relative'}}>
        <div className="grid-bg" />
        <LandingPage
          onStart={()=>navigate('dashboard')}
          onExplore={()=>navigate('overview')}
          onDemo={async ()=>{
            await navigate('dashboard');
            runDemo(
              (p)=>setAppState(s=>({...s,currentPage:p})),
              setAppState,
              sleep
            );
          }}
        />
      </div>
    );
  }

  if (appState.currentPage === 'completion') {
    return (
      <div className="app-layout">
        <div className="grid-bg" />
        <Sidebar
          currentPage={appState.currentPage}
          progress={appState.progress}
          collapsed={appState.sidebarCollapsed}
          onNavigate={navigate}
          onToggle={()=>setAppState(p=>({...p,sidebarCollapsed:!p.sidebarCollapsed}))}
        />
        <div className="main-area">
          <Topbar currentPage={appState.currentPage} trustStatus={trustStatus} notifications={appState.notifications} onNavigate={navigate} onReset={handleReset} />
          <div className="page-content">
            <CompletionPage
              progress={appState.progress}
              keyPair={appState.keyPair}
              certificate={appState.certificate}
              onReset={handleReset}
              onNavigate={navigate}
            />
          </div>
        </div>
      </div>
    );
  }

  const renderPage = () => {
    if (pageLoading) {
      return (
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'200px',gap:'12px'}}>
          <div style={{width:'24px',height:'24px',border:'2px solid rgba(0,180,255,0.3)',borderTopColor:'var(--accent)',borderRadius:'50%',animation:'spin 0.8s linear infinite'}} />
          <span style={{color:'var(--text-dim)',fontSize:'13px'}}>Loading...</span>
        </div>
      );
    }
    switch (appState.currentPage) {
      case 'dashboard':
        return <DashboardPage progress={appState.progress} certificate={appState.certificate} keyPair={appState.keyPair} onNavigate={navigate} />;
      case 'overview':
        return <OverviewPage onComplete={()=>markComplete('overview')} onNavigate={navigate} />;
      case 'keygen':
        return <KeygenPage keyPair={appState.keyPair} userInfo={appState.userInfo} onGenerate={(kp,ui)=>setAppState(p=>({...p,keyPair:kp,userInfo:ui}))} onComplete={()=>markComplete('keygen')} onNavigate={navigate} />;
      case 'csr':
        return <CSRPage keyPair={appState.keyPair} userInfo={appState.userInfo} csr={appState.csr} onGenerate={(c)=>setAppState(p=>({...p,csr:c}))} onSubmit={()=>{}} onComplete={()=>markComplete('csr')} onNavigate={navigate} />;
      case 'ca':
        return <CAPage csr={appState.csr} onIssue={(c)=>setAppState(p=>({...p,certificate:c}))} onComplete={()=>markComplete('ca')} onNavigate={navigate} />;
      case 'certificate':
        return <CertificatePage certificate={appState.certificate} onComplete={()=>markComplete('certificate')} onNavigate={navigate} />;
      case 'validation':
        return <ValidationPage certificate={appState.certificate} onComplete={()=>markComplete('validation')} onNavigate={navigate} />;
      case 'auth':
        return <AuthPage certificate={appState.certificate} onComplete={()=>markComplete('auth')} onNavigate={navigate} />;
      case 'communication':
        return <CommunicationPage certificate={appState.certificate} onComplete={()=>markComplete('communication')} onNavigate={navigate} />;
      case 'management':
        return <ManagementPage
          certificates={appState.certificates}
          onRevoke={(id)=>setAppState(p=>({...p,certificates:p.certificates.map(c=>c.id===id?{...c,status:'revoked'}:c)}))}
          onComplete={()=>markComplete('management')}
          onNavigate={navigate}
        />;
      case 'revocation':
        return <RevocationPage revocationStatus={appState.revocationStatus} onRevoke={()=>setAppState(p=>({...p,revocationStatus:'revoked'}))} onComplete={()=>markComplete('revocation')} onNavigate={navigate} />;
      case 'securityLab':
        return <SecurityLabPage onComplete={()=>markComplete('securityLab')} />;
      case 'journey':
        return <JourneyPage progress={appState.progress} onNavigate={navigate} onComplete={()=>markComplete('journey')} />;
      default:
        return <DashboardPage progress={appState.progress} certificate={appState.certificate} keyPair={appState.keyPair} onNavigate={navigate} />;
    }
  };

  return (
    <div className="app-layout">
      <div className="grid-bg" />
      <Sidebar
        currentPage={appState.currentPage}
        progress={appState.progress}
        collapsed={appState.sidebarCollapsed}
        onNavigate={navigate}
        onToggle={()=>setAppState(p=>({...p,sidebarCollapsed:!p.sidebarCollapsed}))}
      />
      <div className="main-area">
        <Topbar currentPage={appState.currentPage} trustStatus={trustStatus} notifications={appState.notifications} onNavigate={navigate} onReset={handleReset} />
        <div className="page-content">
          {renderPage()}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
