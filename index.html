<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PKI Simulator — Interactive Public Key Infrastructure</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --bg-primary: #040d1a;
    --bg-secondary: #071628;
    --bg-card: rgba(10, 30, 60, 0.7);
    --bg-glass: rgba(6, 20, 45, 0.6);
    --border: rgba(0, 180, 255, 0.15);
    --border-bright: rgba(0, 200, 255, 0.4);
    --accent: #00b4ff;
    --accent2: #0066ff;
    --accent3: #00ffb3;
    --success: #00e676;
    --error: #ff3d71;
    --warn: #ffaa00;
    --text-primary: #e8f4ff;
    --text-secondary: #7eb8d4;
    --text-dim: #3a6a8a;
    --sidebar-w: 260px;
    --topbar-h: 60px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg-primary); color: var(--text-primary); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; overflow-x: hidden; }
  #root { height: 100%; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: rgba(0,180,255,0.3); border-radius: 3px; }

  /* Animations */
  @keyframes fadeIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeInLeft { from { opacity:0; transform:translateX(-20px); } to { opacity:1; transform:translateX(0); } }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
  @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  @keyframes glow { 0%,100% { box-shadow:0 0 8px rgba(0,180,255,0.3); } 50% { box-shadow:0 0 24px rgba(0,180,255,0.7),0 0 48px rgba(0,100,255,0.3); } }
  @keyframes shimmer { 0% { background-position:-200% 0; } 100% { background-position:200% 0; } }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }
  @keyframes slideDown { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideRight { from { opacity:0; transform:translateX(-30px); } to { opacity:1; transform:translateX(0); } }
  @keyframes packetMove { 0% { left:0; opacity:1; } 100% { left:calc(100% - 24px); opacity:0.7; } }
  @keyframes packetMoveBack { 0% { left:calc(100% - 24px); opacity:1; } 100% { left:0; opacity:0.7; } }
  @keyframes gridPulse { 0%,100% { opacity:0.03; } 50% { opacity:0.07; } }
  @keyframes countUp { from { opacity:0; } to { opacity:1; } }
  @keyframes checkmark { 0% { stroke-dashoffset:100; } 100% { stroke-dashoffset:0; } }
  @keyframes borderGlow { 0%,100% { border-color:rgba(0,180,255,0.2); } 50% { border-color:rgba(0,180,255,0.6); } }
  @keyframes progressBar { from { width:0; } to { width:var(--target-width,100%); } }

  .fade-in { animation: fadeIn 0.5s ease forwards; }
  .fade-in-left { animation: fadeInLeft 0.4s ease forwards; }
  .slide-down { animation: slideDown 0.3s ease forwards; }
  .float-anim { animation: float 3s ease-in-out infinite; }

  /* Grid background */
  .grid-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(0,180,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,180,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridPulse 4s ease-in-out infinite;
  }

  /* Layout */
  .app-layout { display:flex; height:100vh; position:relative; overflow:hidden; }
  
  /* Sidebar */
  .sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: linear-gradient(180deg, rgba(4,15,35,0.98) 0%, rgba(4,12,28,0.98) 100%);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: all 0.3s ease;
    z-index: 100; position: relative;
    backdrop-filter: blur(20px);
  }
  .sidebar.collapsed { width: 60px; min-width: 60px; }
  .sidebar-header {
    padding: 16px; border-bottom: 1px solid var(--border);
    display:flex; align-items:center; gap:10px;
  }
  .sidebar-logo {
    width:36px; height:36px; background:linear-gradient(135deg,#0066ff,#00b4ff);
    border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:16px; flex-shrink:0;
  }
  .sidebar-title { font-size:13px; font-weight:700; color:var(--accent); letter-spacing:1.5px; white-space:nowrap; overflow:hidden; }
  .sidebar-subtitle { font-size:10px; color:var(--text-dim); letter-spacing:0.5px; }
  .sidebar-nav { flex:1; overflow-y:auto; padding:8px 0; }
  .nav-section-label {
    font-size:10px; font-weight:600; color:var(--text-dim); letter-spacing:2px;
    padding:12px 16px 4px; text-transform:uppercase;
  }
  .nav-item {
    display:flex; align-items:center; gap:10px; padding:10px 16px;
    cursor:pointer; transition:all 0.2s; border-left:3px solid transparent;
    position:relative; user-select:none;
  }
  .nav-item:hover { background:rgba(0,180,255,0.06); border-left-color:rgba(0,180,255,0.3); }
  .nav-item.active { background:rgba(0,180,255,0.1); border-left-color:var(--accent); }
  .nav-item.completed .nav-status { color:var(--success); }
  .nav-item.current .nav-status { color:var(--accent); }
  .nav-item.locked { opacity:0.4; cursor:not-allowed; }
  .nav-icon { font-size:16px; flex-shrink:0; width:20px; text-align:center; }
  .nav-label { font-size:13px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; flex:1; }
  .nav-item.active .nav-label { color:var(--text-primary); }
  .nav-status { font-size:10px; }
  .sidebar-progress { padding:16px; border-top:1px solid var(--border); }
  .progress-label { font-size:11px; color:var(--text-dim); margin-bottom:6px; display:flex; justify-content:space-between; }
  .progress-bar-outer { height:4px; background:rgba(255,255,255,0.06); border-radius:2px; overflow:hidden; }
  .progress-bar-inner { height:100%; background:linear-gradient(90deg,var(--accent2),var(--accent)); border-radius:2px; transition:width 0.5s ease; }

  /* Topbar */
  .topbar {
    height: var(--topbar-h); background:rgba(4,13,26,0.9); backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border); display:flex; align-items:center;
    padding:0 20px; gap:16px; flex-shrink:0; z-index:50;
  }
  .topbar-stage { font-size:12px; color:var(--text-dim); }
  .topbar-stage span { color:var(--accent); font-weight:600; }
  .topbar-divider { width:1px; height:20px; background:var(--border); }
  .status-pill {
    display:flex; align-items:center; gap:6px; padding:4px 10px;
    border:1px solid var(--border); border-radius:20px; font-size:11px;
  }
  .status-dot { width:6px; height:6px; border-radius:50%; }
  .status-dot.online { background:var(--success); box-shadow:0 0 6px var(--success); animation:pulse 2s infinite; }
  .status-dot.verified { background:var(--accent); box-shadow:0 0 6px var(--accent); animation:pulse 2s infinite; }
  .topbar-spacer { flex:1; }
  .topbar-btn {
    padding:6px 12px; border:1px solid var(--border); border-radius:6px;
    background:transparent; color:var(--text-secondary); font-size:12px;
    cursor:pointer; transition:all 0.2s;
  }
  .topbar-btn:hover { border-color:var(--accent); color:var(--accent); }

  /* Main content */
  .main-area { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .page-content { flex:1; overflow-y:auto; padding:24px; position:relative; z-index:1; }

  /* Cards */
  .card {
    background:var(--bg-card); border:1px solid var(--border);
    border-radius:12px; padding:20px; backdrop-filter:blur(10px);
    transition:all 0.2s;
  }
  .card:hover { border-color:rgba(0,180,255,0.25); }
  .card-glow { animation:glow 3s ease-in-out infinite; }
  .glass-card {
    background:rgba(6,20,50,0.5); border:1px solid rgba(0,180,255,0.12);
    border-radius:12px; backdrop-filter:blur(16px); padding:20px;
  }

  /* Buttons */
  .btn-primary {
    background:linear-gradient(135deg,#0052cc,#0099ff); color:#fff;
    border:none; padding:12px 28px; border-radius:8px; font-size:14px;
    font-weight:600; cursor:pointer; transition:all 0.2s; letter-spacing:0.3px;
    position:relative; overflow:hidden;
  }
  .btn-primary:hover { transform:translateY(-1px); box-shadow:0 8px 24px rgba(0,100,255,0.4); }
  .btn-primary:active { transform:translateY(0); }
  .btn-primary:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
  .btn-secondary {
    background:transparent; color:var(--accent); border:1px solid var(--border-bright);
    padding:10px 24px; border-radius:8px; font-size:13px; font-weight:600;
    cursor:pointer; transition:all 0.2s; letter-spacing:0.3px;
  }
  .btn-secondary:hover { background:rgba(0,180,255,0.08); border-color:var(--accent); }
  .btn-danger {
    background:rgba(255,61,113,0.15); color:var(--error); border:1px solid rgba(255,61,113,0.3);
    padding:10px 24px; border-radius:8px; font-size:13px; font-weight:600;
    cursor:pointer; transition:all 0.2s;
  }
  .btn-danger:hover { background:rgba(255,61,113,0.25); border-color:var(--error); }
  .btn-success {
    background:rgba(0,230,118,0.15); color:var(--success); border:1px solid rgba(0,230,118,0.3);
    padding:10px 24px; border-radius:8px; font-size:13px; font-weight:600;
    cursor:pointer; transition:all 0.2s;
  }
  .btn-success:hover { background:rgba(0,230,118,0.25); border-color:var(--success); }
  .btn-sm { padding:6px 14px; font-size:12px; }
  .btn-icon {
    width:32px; height:32px; border:1px solid var(--border); border-radius:6px;
    background:transparent; color:var(--text-secondary); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:14px;
    transition:all 0.2s;
  }
  .btn-icon:hover { border-color:var(--accent); color:var(--accent); }

  /* Form */
  .form-group { margin-bottom:16px; }
  .form-label { font-size:12px; color:var(--text-dim); margin-bottom:6px; display:block; letter-spacing:0.5px; }
  .form-input {
    width:100%; background:rgba(4,15,35,0.8); border:1px solid var(--border);
    border-radius:8px; padding:10px 14px; color:var(--text-primary); font-size:13px;
    outline:none; transition:all 0.2s;
  }
  .form-input:focus { border-color:var(--accent); box-shadow:0 0 0 2px rgba(0,180,255,0.1); }
  .form-select {
    width:100%; background:rgba(4,15,35,0.8); border:1px solid var(--border);
    border-radius:8px; padding:10px 14px; color:var(--text-primary); font-size:13px;
    outline:none; cursor:pointer;
  }

  /* Page headers */
  .page-header { margin-bottom:28px; }
  .page-eyebrow { font-size:11px; font-weight:600; color:var(--accent); letter-spacing:2px; text-transform:uppercase; margin-bottom:6px; }
  .page-title { font-size:28px; font-weight:700; color:var(--text-primary); line-height:1.2; }
  .page-subtitle { font-size:14px; color:var(--text-secondary); margin-top:8px; line-height:1.6; }

  /* Tags / Badges */
  .badge {
    display:inline-flex; align-items:center; gap:4px; padding:3px 10px;
    border-radius:20px; font-size:11px; font-weight:600; letter-spacing:0.5px;
  }
  .badge-success { background:rgba(0,230,118,0.12); color:var(--success); border:1px solid rgba(0,230,118,0.3); }
  .badge-error { background:rgba(255,61,113,0.12); color:var(--error); border:1px solid rgba(255,61,113,0.3); }
  .badge-warn { background:rgba(255,170,0,0.12); color:var(--warn); border:1px solid rgba(255,170,0,0.3); }
  .badge-info { background:rgba(0,180,255,0.12); color:var(--accent); border:1px solid rgba(0,180,255,0.3); }

  /* Code block */
  .code-block {
    background:rgba(2,8,20,0.9); border:1px solid rgba(0,180,255,0.1);
    border-radius:8px; padding:16px; font-family:'Courier New',monospace;
    font-size:11px; color:#7eb8d4; line-height:1.7; white-space:pre-wrap;
    word-break:break-all; position:relative; overflow:hidden;
  }
  .code-block::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg,transparent,rgba(0,180,255,0.5),transparent);
  }

  /* Info panel */
  .info-panel {
    background:rgba(0,100,255,0.06); border:1px solid rgba(0,180,255,0.15);
    border-left:3px solid var(--accent); border-radius:8px; padding:14px 16px;
    font-size:13px; color:var(--text-secondary); line-height:1.6;
  }

  /* Step item */
  .step-item {
    display:flex; align-items:flex-start; gap:12px; padding:12px 0;
    border-bottom:1px solid rgba(255,255,255,0.04);
  }
  .step-icon {
    width:32px; height:32px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-size:14px; flex-shrink:0;
  }
  .step-icon.success { background:rgba(0,230,118,0.15); color:var(--success); border:1px solid rgba(0,230,118,0.3); }
  .step-icon.error { background:rgba(255,61,113,0.15); color:var(--error); border:1px solid rgba(255,61,113,0.3); }
  .step-icon.pending { background:rgba(0,180,255,0.1); color:var(--accent); border:1px solid rgba(0,180,255,0.2); animation:pulse 1.5s infinite; }
  .step-icon.idle { background:rgba(255,255,255,0.04); color:var(--text-dim); border:1px solid var(--border); }

  /* Table */
  .data-table { width:100%; border-collapse:collapse; }
  .data-table th { font-size:11px; font-weight:600; color:var(--text-dim); letter-spacing:1px; padding:10px 14px; text-align:left; border-bottom:1px solid var(--border); text-transform:uppercase; }
  .data-table td { font-size:13px; color:var(--text-secondary); padding:12px 14px; border-bottom:1px solid rgba(255,255,255,0.03); }
  .data-table tr:hover td { background:rgba(0,180,255,0.03); }

  /* Modal */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(2,6,18,0.85); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:24px;
    backdrop-filter:blur(4px); animation:fadeIn 0.2s ease;
  }
  .modal-box {
    background:var(--bg-secondary); border:1px solid var(--border-bright);
    border-radius:16px; padding:28px; max-width:500px; width:100%;
    animation:slideDown 0.3s ease;
  }
  .modal-title { font-size:18px; font-weight:700; margin-bottom:12px; }
  .modal-body { font-size:13px; color:var(--text-secondary); line-height:1.6; margin-bottom:20px; }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; }

  /* Tooltip / explanation */
  .explain-btn {
    display:inline-flex; align-items:center; gap:4px; font-size:11px;
    color:var(--accent); cursor:pointer; border:1px solid rgba(0,180,255,0.2);
    padding:3px 8px; border-radius:4px; background:rgba(0,180,255,0.04);
    transition:all 0.2s; user-select:none;
  }
  .explain-btn:hover { background:rgba(0,180,255,0.1); }
  .explain-panel {
    background:rgba(0,30,70,0.8); border:1px solid rgba(0,180,255,0.2);
    border-radius:8px; padding:14px; margin-top:8px; font-size:13px;
    color:var(--text-secondary); line-height:1.6; animation:slideDown 0.2s ease;
  }

  /* Grid layouts */
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
  .grid-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }

  /* Flow diagram */
  .flow-item {
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:10px; position:relative;
  }
  .flow-node {
    background:var(--bg-card); border:1px solid var(--border-bright);
    border-radius:8px; padding:10px 16px; font-size:12px; font-weight:600;
    color:var(--accent); white-space:nowrap; text-align:center;
    min-width:120px;
  }
  .flow-arrow { color:var(--text-dim); font-size:20px; line-height:1; }

  /* Loading screen */
  .loading-screen {
    position:fixed; inset:0; background:var(--bg-primary); z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px;
  }
  .loading-logo {
    width:80px; height:80px; background:linear-gradient(135deg,#001a4d,#003380);
    border:2px solid rgba(0,180,255,0.3); border-radius:20px;
    display:flex; align-items:center; justify-content:center; font-size:36px;
    animation:glow 2s ease-in-out infinite;
  }
  .loading-title { font-size:22px; font-weight:700; color:var(--text-primary); }
  .loading-status { font-size:13px; color:var(--accent); min-height:20px; }
  .loading-bar-outer { width:300px; height:3px; background:rgba(255,255,255,0.05); border-radius:2px; overflow:hidden; }
  .loading-bar-inner { height:100%; background:linear-gradient(90deg,var(--accent2),var(--accent)); border-radius:2px; transition:width 0.4s ease; }
  .loading-dots { display:flex; gap:6px; }
  .loading-dot { width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:0.3; animation:pulse 1.2s ease-in-out infinite; }
  .loading-dot:nth-child(2) { animation-delay:0.2s; }
  .loading-dot:nth-child(3) { animation-delay:0.4s; }

  /* Landing page */
  .landing { position:relative; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; text-align:center; }
  .landing-hero-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(0,180,255,0.08); border:1px solid rgba(0,180,255,0.2); border-radius:20px; padding:6px 14px; font-size:11px; font-weight:600; color:var(--accent); letter-spacing:1.5px; margin-bottom:24px; }
  .landing-title { font-size:clamp(36px,6vw,72px); font-weight:800; line-height:1.1; margin-bottom:8px; background:linear-gradient(135deg,#fff 30%,#7eb8d4 80%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .landing-sub-title { font-size:clamp(20px,3vw,32px); font-weight:300; color:var(--accent); margin-bottom:20px; }
  .landing-desc { font-size:15px; color:var(--text-secondary); max-width:560px; line-height:1.7; margin-bottom:36px; }
  .landing-btns { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-bottom:60px; }
  .btn-landing-primary {
    background:linear-gradient(135deg,#0052cc,#00aaff); color:#fff; border:none;
    padding:16px 36px; border-radius:10px; font-size:15px; font-weight:700;
    cursor:pointer; transition:all 0.2s; letter-spacing:0.5px;
  }
  .btn-landing-primary:hover { transform:translateY(-2px); box-shadow:0 12px 36px rgba(0,100,255,0.5); }
  .btn-landing-secondary {
    background:transparent; color:var(--accent); border:1.5px solid rgba(0,180,255,0.4);
    padding:15px 32px; border-radius:10px; font-size:15px; font-weight:600;
    cursor:pointer; transition:all 0.2s;
  }
  .btn-landing-secondary:hover { background:rgba(0,180,255,0.08); border-color:var(--accent); }
  .landing-flow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; }
  .landing-flow-node { background:rgba(0,180,255,0.08); border:1px solid rgba(0,180,255,0.2); border-radius:8px; padding:8px 14px; font-size:12px; font-weight:600; color:var(--text-secondary); }
  .landing-flow-arrow { color:var(--accent); font-size:18px; }

  /* Overview cards */
  .component-card {
    background:var(--bg-card); border:1px solid var(--border); border-radius:12px;
    padding:16px; cursor:pointer; transition:all 0.25s; display:flex; flex-direction:column; gap:8px;
  }
  .component-card:hover { border-color:rgba(0,180,255,0.4); transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,0.3); }
  .component-card.selected { border-color:var(--accent); background:rgba(0,180,255,0.08); }
  .component-icon { font-size:24px; }
  .component-name { font-size:13px; font-weight:600; color:var(--text-primary); }
  .component-desc { font-size:12px; color:var(--text-dim); line-height:1.5; }

  /* Key display */
  .key-display {
    background:rgba(2,8,20,0.9); border:1px solid rgba(0,180,255,0.15);
    border-radius:10px; padding:16px; font-family:'Courier New',monospace;
    font-size:11px; line-height:1.6; word-break:break-all;
  }
  .key-display.public { border-left:3px solid var(--accent); }
  .key-display.private { border-left:3px solid var(--warn); }

  /* Certificate card */
  .cert-card {
    background:linear-gradient(135deg,rgba(4,18,45,0.95),rgba(2,12,30,0.95));
    border:1px solid rgba(0,180,255,0.2); border-radius:16px; overflow:hidden;
  }
  .cert-header {
    background:linear-gradient(90deg,rgba(0,50,130,0.5),rgba(0,30,80,0.5));
    padding:20px 24px; border-bottom:1px solid rgba(0,180,255,0.15);

  /* Validation checks */
  .check-item {

  }
  .check-item.idle { background:rgba(255,255,255,0.02); border:1px solid var(--border); }

  /* Auth diagram */
  .auth-flow {

  .auth-box-title { font-size:14px; font-weight:700; color:var(--text-primary); margin-bottom:4px; }

  .auth-channel { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .auth-msg {
    background:rgba(0,180,255,0.08); border:1px solid rgba(0,180,255,0.2);

  /* Packet animation */

  /* Security lab */

  .journey-line { position:absolute; left:19px; top:56px; width:2px; background:var(--border); bottom:0; }

  .journey-desc { font-size:13px; color:var(--text-dim); margin-top:4px; }

  /* Dashboard stats */
  .stat-card {
    background:var(--bg-card); border:1px solid var(--border); border-radius:12px;

  }
  .stat-card:hover { border-color:rgba(0,180,255,0.25); }
  .stat-icon { font-size:24px; }
  .stat-value { font-size:28px; font-weight:700; color:var(--text-primary); }
  .stat-label { font-size:12px; color:var(--text-dim); }
  .stat-status { font-size:11px; }

  /* Responsive */
  @media (max-width:768px) {
    .sidebar { position:fixed; left:0; top:0; bottom:0; transform:translateX(-100%); transition:transform 0.3s; }
    .sidebar.mobile-open { transform:translateX(0); }
    .grid-2, .grid-3, .grid-4 { grid-template-columns:1fr; }
    .landing-title { font-size:32px; }
    .auth-flow { grid-template-columns:1fr; }
    .page-content { padding:16px; }
  }

  /* Completion page */
  .completion-star { font-size:80px; animation:float 2s ease-in-out infinite; display:block; text-align:center; }
  .achievement-item {
    display:flex; align-items:center; gap:12px; padding:12px 16px;
    background:rgba(0,230,118,0.04); border:1px solid rgba(0,230,118,0.1);
    border-radius:8px; margin-bottom:8px; animation:fadeInLeft 0.4s ease forwards;
  }
  .achievement-icon { font-size:18px; }
  .achievement-text { font-size:13px; color:var(--text-secondary); }

  /* Notification dot */
  .notif-dot { width:8px; height:8px; background:var(--error); border-radius:50%; position:absolute; top:2px; right:2px; }

  /* Shimmer loading */
  .shimmer {
    background:linear-gradient(90deg,rgba(255,255,255,0.03) 25%,rgba(255,255,255,0.06) 50%,rgba(255,255,255,0.03) 75%);
    background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:6px;
  }
  
  /* Trust chain */
  .trust-chain { display:flex; flex-direction:column; align-items:center; gap:0; }
  .trust-node {
    background:var(--bg-card); border:1px solid var(--border); border-radius:10px;
    padding:12px 20px; text-align:center; cursor:pointer; transition:all 0.2s;
    min-width:200px;
  }
  .trust-node:hover { border-color:var(--accent); }
  .trust-node.selected { border-color:var(--accent); background:rgba(0,180,255,0.08); }
  .trust-connector { height:30px; width:2px; background:linear-gradient(180deg,rgba(0,180,255,0.4),rgba(0,180,255,0.2)); position:relative; }
  .trust-connector::after { content:'▼'; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); font-size:10px; color:rgba(0,180,255,0.4); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── Utilities ────────────────────────────────────────────────────────────────
const sleep = ms => new Promise(r => setTimeout(r, ms));
const randomHex = len => Array.from({length:len}, () => Math.floor(Math.random()*16).toString(16)).join('');
const randomBase64 = len => {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  let s=''; for(let i=0;i<len;i++) s+=chars[Math.floor(Math.random()*64)]; return s;
};
const formatKey = (header, data) => `-----BEGIN ${header}-----\n${data.match(/.{1,64}/g)?.join('\n')}\n-----END ${header}-----`;
const genPublicKey = () => formatKey('PUBLIC KEY', 'MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A'+randomBase64(200)+'IDAQAB');
const genPrivateKey = () => formatKey('PRIVATE KEY', 'MIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC'+randomBase64(300)+'DAQAB');
const genFingerprint = () => randomHex(64).match(/.{2}/g).join(':').toUpperCase();
const genSerial = () => randomHex(16).toUpperCase().match(/.{2}/g).join(':');
const now = () => new Date();
const dateStr = (d) => d.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
const addYear = (d,y=1) => { const n=new Date(d); n.setFullYear(n.getFullYear()+y); return n; };

// ─── Initial State ────────────────────────────────────────────────────────────
const initState = () => ({
  currentPage: 'landing',
  loading: true,
  sidebarCollapsed: false,
  progress: {
    overview: false, keygen: false, csr: false, ca: false,
    certificate: false, validation: false, auth: false,
    communication: false, management: false, revocation: false,
    securityLab: false, journey: false
  },
  keyPair: null,
  userInfo: { name:'', org:'', domain:'', email:'' },
  csr: null,
  certificate: null,
  certificates: [
    { id:1, cn:'secure-demo.example', org:'Secure Labs', issuer:'PKI Learning Root CA', status:'valid', validFrom:new Date('2026-01-15'), validTo:new Date('2027-01-15'), serial:genSerial(), fingerprint:genFingerprint() },
    { id:2, cn:'api-demo.example', org:'API Services Inc.', issuer:'PKI Learning Root CA', status:'valid', validFrom:new Date('2026-03-10'), validTo:new Date('2027-03-10'), serial:genSerial(), fingerprint:genFingerprint() },
    { id:3, cn:'expired-demo.example', org:'Old Corp', issuer:'PKI Learning Root CA', status:'expired', validFrom:new Date('2024-01-01'), validTo:new Date('2025-01-01'), serial:genSerial(), fingerprint:genFingerprint() },
    { id:4, cn:'revoked-demo.example', org:'Revoked Inc.', issuer:'PKI Learning Root CA', status:'revoked', validFrom:new Date('2025-06-01'), validTo:new Date('2026-06-01'), serial:genSerial(), fingerprint:genFingerprint() },
    { id:5, cn:'pending-demo.example', org:'Startup Co.', issuer:'—', status:'pending', validFrom:null, validTo:null, serial:'PENDING', fingerprint:'—' },
  ],
  notifications: 1,
  demoMode: false,
  authStep: -1,
  commStep: -1,
  revocationStatus: 'valid',
  selectedCert: null,
  trustStatus: 'establishing',
});

// ─── Explanation data ─────────────────────────────────────────────────────────
const EXPLANATIONS = {
  ca: { title:'Certificate Authority (CA)', text:'A Certificate Authority is a trusted organization that issues digital certificates. It verifies the identity of entities (like websites or organizations) and binds their identity to a public key by issuing a digitally signed certificate. The CA acts as the root of trust in PKI.' },
  publicKey: { title:'Public Key', text:'A public key is a cryptographic key that can be shared openly with anyone. It is used to encrypt data or verify digital signatures. Anyone with the public key can verify that a message was signed by the corresponding private key holder.' },
  privateKey: { title:'Private Key', text:'A private key is a secret cryptographic key that must never be shared. It is mathematically paired with the public key. It is used to decrypt data encrypted with the public key, or to create digital signatures that prove identity.' },
  certificate: { title:'Digital Certificate', text:'A digital certificate is an electronic document that binds a public key to an identity (like a domain name or organization). It is signed by a Certificate Authority to prove authenticity. Browsers use certificates to verify that a website is who it claims to be.' },
  csr: { title:'Certificate Signing Request (CSR)', text:'A CSR is a message sent from an applicant to a CA to apply for a digital certificate. It contains the applicant\'s public key, identity information, and is digitally signed by the applicant\'s private key. The CA uses this to verify identity before issuing a certificate.' },
  signature: { title:'Digital Signature', text:'A digital signature is a cryptographic mechanism that proves authenticity and integrity. Data is signed using a private key, producing a signature. Anyone with the corresponding public key can verify the signature, confirming the data came from the key holder and was not tampered with.' },
  trustChain: { title:'Trust Chain / Certificate Chain', text:'A trust chain is the ordered list of certificates linking a server certificate back to a trusted root CA. Each certificate is signed by the one above it. Browsers and systems have a built-in list of trusted root CAs. If the chain leads to a trusted root, the certificate is trusted.' },
  validation: { title:'Certificate Validation', text:'Certificate validation is the process of verifying that a certificate is authentic, trusted, and currently valid. This includes checking the certificate format, verifying the CA\'s signature, checking the expiry date, verifying the domain, and validating the trust chain up to a trusted root CA.' },
};

// ─── Explain Button Component ─────────────────────────────────────────────────
function ExplainBtn({ topic }) {
  const [open, setOpen] = useState(false);
  const info = EXPLANATIONS[topic];
  if (!info) return null;
  return (
    <div style={{display:'inline-block',marginTop:'8px'}}>
      <span className="explain-btn" onClick={()=>setOpen(o=>!o)}>
        ❓ What is this?
      </span>
      {open && (
        <div className="explain-panel">
          <div style={{fontWeight:600,color:'var(--accent)',marginBottom:'6px'}}>{info.title}</div>
          {info.text}
        </div>
      )}
    </div>
  );
}

// ─── Modal ────────────────────────────────────────────────────────────────────
function Modal({ title, children, onClose, actions }) {
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-box">
        <div className="modal-title">{title}</div>
        <div className="modal-body">{children}</div>
        {actions && <div className="modal-actions">{actions}</div>}
      </div>
    </div>
  );
}

// ─── Loading Screen ───────────────────────────────────────────────────────────
function LoadingScreen({ onDone }) {
  const steps = [
    'Initializing Trust Infrastructure...',
    'Loading Certificate Authority...',
    'Loading Certificate Store...',
    'Establishing Simulation Environment...',
    'PKI Environment Ready ✓'
  ];
  const [step, setStep] = useState(0);
  const [progress, setProgress] = useState(0);

  useEffect(() => {
    let i = 0;
    const interval = setInterval(() => {
      i++;
      setStep(i);
      setProgress(Math.min((i / steps.length) * 100, 100));
      if (i >= steps.length) {
        clearInterval(interval);
        setTimeout(onDone, 600);
      }
    }, 600);
    return () => clearInterval(interval);
  }, []);

  return (
    <div className="loading-screen">
      <div className="grid-bg" />
      <div className="loading-logo">🔐</div>
      <div className="loading-title">PKI SIMULATOR</div>
      <div style={{fontSize:'12px',color:'var(--text-dim)',letterSpacing:'3px'}}>INTERACTIVE LEARNING PLATFORM</div>
      <div style={{height:'30px',display:'flex',alignItems:'center'}}>
        <div className="loading-status">{steps[Math.min(step,steps.length-1)]}</div>
      </div>
      <div className="loading-bar-outer">
        <div className="loading-bar-inner" style={{width:`${progress}%`}} />
      </div>
      <div className="loading-dots">
        <div className="loading-dot" /><div className="loading-dot" /><div className="loading-dot" />
      </div>
    </div>
  );
}

// ─── Sidebar ──────────────────────────────────────────────────────────────────
const NAV_ITEMS = [
  { id:'dashboard', label:'Dashboard', icon:'📊', section:'main' },
  { id:'overview', label:'PKI Overview', icon:'🌐', section:'main' },
  { id:'keygen', label:'Key Generation', icon:'🔑', section:'simulation' },
  { id:'csr', label:'CSR Lab', icon:'📋', section:'simulation' },
  { id:'ca', label:'Certificate Authority', icon:'🏛️', section:'simulation' },
  { id:'certificate', label:'Certificates', icon:'📜', section:'simulation' },
  { id:'validation', label:'Validation Lab', icon:'✅', section:'simulation' },
  { id:'auth', label:'Authentication', icon:'🛡️', section:'simulation' },
  { id:'communication', label:'Secure Comms', icon:'🔒', section:'simulation' },
  { id:'management', label:'Cert Management', icon:'📁', section:'management' },
  { id:'revocation', label:'Revocation', icon:'🚫', section:'management' },
  { id:'securityLab', label:'Security Lab', icon:'⚠️', section:'management' },
  { id:'journey', label:'PKI Journey', icon:'🗺️', section:'management' },
];

function Sidebar({ currentPage, progress, collapsed, onNavigate, onToggle }) {
  const completedCount = Object.values(progress).filter(Boolean).length;
  const totalCount = Object.keys(progress).length;
  const pct = Math.round((completedCount / totalCount) * 100);

  const getStatus = (id) => {
    if (id === currentPage) return 'current';
    if (progress[id]) return 'completed';
    return 'idle';
  };

  const sections = { main:'CORE', simulation:'SIMULATION', management:'MANAGEMENT' };
  let lastSection = null;

  return (
    <div className={`sidebar ${collapsed?'collapsed':''}`}>
      <div className="sidebar-header">
        <div className="sidebar-logo">🔐</div>
        {!collapsed && (
          <div style={{flex:1,overflow:'hidden'}}>
            <div className="sidebar-title">PKI SIMULATOR</div>
            <div className="sidebar-subtitle">Cybersecurity Lab</div>
          </div>
        )}
        <button className="btn-icon" onClick={onToggle} style={{flexShrink:0}}>
          {collapsed ? '→' : '←'}
        </button>
      </div>

      <div className="sidebar-nav">
        {NAV_ITEMS.map(item => {
          const showSection = !collapsed && item.section !== lastSection;
          if (showSection) lastSection = item.section;
          const status = getStatus(item.id);
          return (
            <React.Fragment key={item.id}>
              {showSection && <div className="nav-section-label">{sections[item.section]}</div>}
              <div
                className={`nav-item ${status} ${status==='completed'?'completed':''} ${currentPage===item.id?'active':''}`}
                onClick={() => onNavigate(item.id)}
                title={collapsed ? item.label : ''}
              >
                <span className="nav-icon">{item.icon}</span>
                {!collapsed && <span className="nav-label">{item.label}</span>}
                {!collapsed && (
                  <span className="nav-status">
                    {status==='completed' ? '✓' : status==='current' ? '●' : '○'}
                  </span>
                )}
              </div>
            </React.Fragment>
          );
        })}
      </div>

      {!collapsed && (
        <div className="sidebar-progress">
          <div className="progress-label">
            <span>Journey</span>
            <span style={{color:'var(--accent)'}}>{completedCount}/{totalCount}</span>
          </div>
          <div className="progress-bar-outer">
            <div className="progress-bar-inner" style={{width:`${pct}%`}} />
          </div>
          <div style={{fontSize:'11px',color:'var(--text-dim)',marginTop:'6px'}}>{pct}% Complete</div>
        </div>
      )}
    </div>
  );
}

// ─── Topbar ───────────────────────────────────────────────────────────────────
function Topbar({ currentPage, trustStatus, notifications, onNavigate, onReset }) {
  const pageNames = {
    dashboard:'Dashboard', overview:'PKI Overview', keygen:'Key Generation',
    csr:'CSR Lab', ca:'Certificate Authority', certificate:'Certificates',
    validation:'Validation Lab', auth:'Authentication', communication:'Secure Communication',
    management:'Cert Management', revocation:'Revocation', securityLab:'Security Lab',
    journey:'PKI Journey', landing:'Welcome', completion:'Complete'
  };
  const [showResetModal, setShowResetModal] = useState(false);

  return (
    <>
      <div className="topbar">
        <div className="topbar-stage">
          Stage: <span>{pageNames[currentPage] || currentPage}</span>
        </div>
        <div className="topbar-divider" />
        <div className="status-pill">
          <div className="status-dot online" />
          <span style={{fontSize:'11px',color:'var(--text-secondary)'}}>PKI ENV: ONLINE</span>
        </div>
        <div className="status-pill">
          <div className="status-dot verified" />
          <span style={{fontSize:'11px',color:'var(--accent)'}}>TRUST: {trustStatus==='established'?'VERIFIED ✓':'ESTABLISHING...'}</span>
        </div>
        <div className="topbar-spacer" />
        <button className="topbar-btn" style={{position:'relative'}} onClick={()=>onNavigate('journey')}>
          🗺️ Journey
          {notifications>0 && <span className="notif-dot" />}
        </button>
        <button className="topbar-btn" onClick={()=>setShowResetModal(true)}>↺ Reset</button>
        <button className="topbar-btn" onClick={()=>alert('PKI Simulator v1.0\nInteractive Cybersecurity Learning Platform\n\nBuilt for academic demonstration.\nAll cryptographic values are simulated for educational purposes.')}>
          ❓ Help
        </button>
      </div>
      {showResetModal && (
        <Modal
          title="⚠️ Reset Simulation"
          onClose={() => setShowResetModal(false)}
          actions={
            <>
              <button className="btn-secondary btn-sm" onClick={()=>setShowResetModal(false)}>Cancel</button>
              <button className="btn-danger btn-sm" onClick={()=>{onReset();setShowResetModal(false);}}>Reset Simulation</button>
            </>
          }
        >
          <p>Resetting will clear your current PKI simulation progress, including generated keys, CSR, and certificate data.</p>
          <p style={{marginTop:'8px'}}>You will be returned to the Overview page.</p>
        </Modal>
      )}
    </>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// PAGE: Landing
// ─────────────────────────────────────────────────────────────────────────────
function LandingPage({ onStart, onDemo, onExplore }) {
  return (
    <div style={{position:'relative',minHeight:'100vh',overflow:'hidden'}}>
      <div className="grid-bg" />
      {/* Decorative orbs */}
      <div style={{position:'absolute',top:'10%',right:'5%',width:'300px',height:'300px',background:'radial-gradient(circle,rgba(0,100,255,0.08),transparent 70%)',borderRadius:'50%',pointerEvents:'none'}} />
      <div style={{position:'absolute',bottom:'15%',left:'5%',width:'200px',height:'200px',background:'radial-gradient(circle,rgba(0,180,255,0.06),transparent 70%)',borderRadius:'50%',pointerEvents:'none'}} />

      <div className="landing fade-in">
        <div className="landing-hero-badge">🔐 CYBERSECURITY LAB • EDUCATIONAL SIMULATOR</div>

function KeygenPage({ keyPair, userInfo, onGenerate, onComplete, onNavigate }) {
  const [form, setForm] = useState(userInfo || { name:'Alice Johnson', org:'Secure Labs Inc.', domain:'secure-demo.example', email:'alice@secure-demo.example' });
  const [generating, setGenerating] = useState(false);
  const [showPrivate, setShowPrivate] = useState(false);
  const [genStep, setGenStep] = useState(-1);

  const genSteps = ['Generating prime numbers...','Computing key pair...','Applying RSA algorithm...','Encoding public key...','Protecting private key...','Key pair ready ✓'];

  const handleGenerate = async () => {
    if (!form.name || !form.domain) { alert('Please enter at least your name and domain.'); return; }
    setGenerating(true);
    setGenStep(0);
    for (let i=0; i<genSteps.length; i++) {
      setGenStep(i);
      await sleep(400);
    }
    const pub = genPublicKey();
    const priv = genPrivateKey();
    onGenerate({ publicKey:pub, privateKey:priv }, form);
    setGenerating(false);
    setGenStep(-1);
  };

  return (
    <div className="fade-in">
      <div className="page-header">
        <div className="page-eyebrow">STAGE 2 • CRYPTOGRAPHY</div>
        <div className="page-title">Key Generation Lab</div>
        <div className="page-subtitle">Generate your RSA cryptographic key pair. Your public key will be shared; your private key must remain secret.</div>
      </div>

      <div className="grid-2" style={{marginBottom:'24px'}}>
        {/* Form */}
        <div className="card">
          <div style={{fontSize:'14px',fontWeight:'600',marginBottom:'16px',color:'var(--accent)'}}>🆔 Entity Information</div>
          {[
            {key:'name',label:'Full Name / Entity Name',placeholder:'e.g. Alice Johnson'},
            {key:'org',label:'Organization',placeholder:'e.g. Secure Labs Inc.'},
            {key:'domain',label:'Domain',placeholder:'e.g. secure-demo.example'},
            {key:'email',label:'Email Address',placeholder:'e.g. alice@example.com'},
          ].map(f => (
            <div className="form-group" key={f.key}>
              <label className="form-label">{f.label.toUpperCase()}</label>
              <input className="form-input" placeholder={f.placeholder} value={form[f.key]} onChange={e=>setForm(p=>({...p,[f.key]:e.target.value}))} />
            </div>
          ))}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div className="info-panel" style={{flex:1,marginRight:'12px',padding:'8px 12px'}}>
              <div style={{fontSize:'11px'}}>Algorithm: RSA-2048 | Key Size: 2048 bits | Format: PKCS#8</div>
            </div>
            <button className="btn-primary" onClick={handleGenerate} disabled={generating}>
              {generating ? '⟳ Generating...' : '🔑 Generate Key Pair'}
            </button>
          </div>
        </div>

        {/* Key diagram */}
        <div className="card" style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'12px'}}>
          <div style={{textAlign:'center',fontWeight:'700',fontSize:'14px',color:'var(--accent)',marginBottom:'8px'}}>KEY PAIR ARCHITECTURE</div>
          <div style={{textAlign:'center',padding:'10px 24px',background:'var(--bg-glass)',border:'1px solid var(--border)',borderRadius:'8px',marginBottom:'4px'}}>KEY PAIR</div>
          <div style={{fontSize:'20px',color:'var(--text-dim)'}}>│</div>
          <div style={{display:'flex',gap:'24px',alignItems:'flex-start'}}>
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'8px'}}>
              <div style={{padding:'10px 20px',background:'rgba(0,180,255,0.1)',border:'1px solid rgba(0,180,255,0.3)',borderRadius:'8px',textAlign:'center'}}>

          <button className="btn-primary" onClick={()=>{onComplete(); onNavigate('csr');}}>Continue to CSR Lab →</button>
        </div>
      )}

      {/* Educational info */}
      <div className="grid-3">
        {[
          {title:'What is a Public Key?',desc:'A public key is safe to share with the world. It is used by others to encrypt messages to you, or to verify your digital signatures.'},
          {title:'What is a Private Key?',desc:'A private key is your secret. It decrypts messages encrypted with your public key and creates signatures that prove your identity.'},
          {title:'Why keep Private Key secret?',desc:'Anyone with your private key can impersonate you, read your encrypted messages, and sign documents as you. It must never be shared.'},
        ].map(i=>(
          <div key={i.title} className="info-panel">
            <div style={{fontWeight:'600',color:'var(--accent)',marginBottom:'6px',fontSize:'12px'}}>{i.title}</div>
            <div style={{fontSize:'12px'}}>{i.desc}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// PAGE: CSR Lab
// ─────────────────────────────────────────────────────────────────────────────
function CSRPage({ keyPair, userInfo, csr, onGenerate, onSubmit, onComplete, onNavigate }) {
  const [form, setForm] = useState({
    commonName: userInfo?.domain || 'secure-demo.example',
    org: userInfo?.org || 'Secure Labs Inc.',
    country: 'IN',
    email: userInfo?.email || 'alice@secure-demo.example',
    domain: userInfo?.domain || 'secure-demo.example',
  });
  const [generated, setGenerated] = useState(!!csr);
  const [submitted, setSubmitted] = useState(false);
  const [animating, setAnimating] = useState(false);

  const handleGenerate = () => {
    const fp = keyPair ? genFingerprint() : genFingerprint();
    const ts = new Date().toISOString();
    const csrData = {
      commonName: form.commonName,
      org: form.org,
      country: form.country,
      email: form.email,
      domain: form.domain,
      publicKeyFingerprint: fp,
      timestamp: ts,
      signature: randomHex(64).toUpperCase(),
    };
    onGenerate(csrData);
    setGenerated(true);
  };

  const handleSubmit = async () => {
    setAnimating(true);
    await sleep(2500);
    setAnimating(false);
    setSubmitted(true);
    onComplete();
  };

  const csrText = csr ? `-----BEGIN CERTIFICATE REQUEST-----

Subject Information:
  Common Name  : ${csr.commonName}
  Organization : ${csr.org}
  Country      : ${csr.country}
  Email        : ${csr.email}
  Domain       : ${csr.domain}

Public Key Fingerprint:
  SHA256: ${csr.publicKeyFingerprint?.substring(0,32)}...

Signature Algorithm: SHA256withRSA

Signature:
  ${csr.signature?.substring(0,32)}...

Timestamp: ${csr.timestamp}

-----END CERTIFICATE REQUEST-----` : '';

  return (
    <div className="fade-in">
      <div className="page-header">
        <div className="page-eyebrow">STAGE 3 • CERTIFICATE REQUEST</div>
        <div className="page-title">Create Certificate Signing Request</div>
        <div className="page-subtitle">A CSR contains your identity information and public key, signed with your private key, sent to the CA for certificate issuance.</div>
      </div>

      {!keyPair && (
        <div style={{padding:'16px 20px',background:'rgba(255,170,0,0.06)',border:'1px solid rgba(255,170,0,0.25)',borderRadius:'10px',marginBottom:'20px'}}>
          ⚠️ You haven't generated a key pair yet. <button className="btn-secondary btn-sm" style={{marginLeft:'8px'}} onClick={()=>onNavigate('keygen')}>Go to Key Generation</button>
        </div>
      )}

      <div className="grid-2" style={{marginBottom:'24px'}}>
        <div>
          <div className="card" style={{marginBottom:'16px'}}>
            <div style={{fontSize:'14px',fontWeight:'600',marginBottom:'16px',color:'var(--accent)'}}>📋 CSR Information</div>
            {[
              {key:'commonName',label:'Common Name (CN)',placeholder:'e.g. secure-demo.example'},
              {key:'org',label:'Organization (O)',placeholder:'e.g. Secure Labs Inc.'},
              {key:'country',label:'Country (C)',placeholder:'e.g. IN'},
              {key:'email',label:'Email Address',placeholder:'e.g. admin@example.com'},
              {key:'domain',label:'Domain (SAN)',placeholder:'e.g. secure-demo.example'},
            ].map(f=>(
              <div className="form-group" key={f.key}>
                <label className="form-label">{f.label.toUpperCase()}</label>
                <input className="form-input" placeholder={f.placeholder} value={form[f.key]} onChange={e=>setForm(p=>({...p,[f.key]:e.target.value}))} />
              </div>
            ))}
            {keyPair && (
              <div style={{padding:'8px 12px',background:'rgba(0,180,255,0.06)',border:'1px solid rgba(0,180,255,0.15)',borderRadius:'6px',marginBottom:'12px'}}>
                <div style={{fontSize:'11px',color:'var(--text-dim)'}}>PUBLIC KEY (from Key Generation)</div>
                <div style={{fontSize:'11px',color:'var(--accent)',fontFamily:'monospace',marginTop:'2px',wordBreak:'break-all'}}>{keyPair.publicKey.substring(0,80)}...</div>
              </div>
            )}
            <button className="btn-primary" onClick={handleGenerate}>
              📋 Generate CSR
            </button>
            <ExplainBtn topic="csr" />
          </div>
        </div>

        {/* CSR Preview */}
        <div>
          <div style={{fontSize:'13px',fontWeight:'600',color:'var(--accent)',marginBottom:'10px'}}>CSR Preview</div>
          {generated && csr ? (
            <div className="code-block fade-in" style={{marginBottom:'12px'}}>{csrText}</div>
          ) : (
            <div style={{background:'rgba(255,255,255,0.02)',border:'1px dashed var(--border)',borderRadius:'8px',padding:'40px',textAlign:'center',color:'var(--text-dim)',fontSize:'13px'}}>
              Fill in the form and click "Generate CSR" to see the preview
            </div>
          )}

          {generated && csr && (
            <div className="card fade-in" style={{marginBottom:'12px'}}>
              <div style={{fontSize:'13px',fontWeight:'600',marginBottom:'12px',color:'var(--accent)'}}>CSR Details</div>
              {[
                {label:'CSR Status',value:'READY',type:'badge-info'},
                {label:'Applicant',value:csr.commonName},
                {label:'Domain',value:csr.domain},
                {label:'Fingerprint',value:csr.publicKeyFingerprint?.substring(0,24)+'...'},
                {label:'Timestamp',value:new Date(csr.timestamp).toLocaleString()},
                {label:'Signature',value:csr.signature?.substring(0,16)+'...'},
              ].map(d=>(
                <div key={d.label} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'1px solid rgba(255,255,255,0.04)'}}>
                  <span style={{fontSize:'12px',color:'var(--text-dim)'}}>{d.label}</span>
                  {d.type ? <span className={`badge ${d.type}`}>{d.value}</span> : <span style={{fontSize:'12px',color:'var(--text-secondary)',fontFamily:'monospace'}}>{d.value}</span>}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {/* Flow animation */}
      {animating && (
        <div className="card fade-in" style={{marginBottom:'20px',textAlign:'center'}}>
          <div style={{fontSize:'14px',fontWeight:'600',color:'var(--accent)',marginBottom:'16px'}}>Submitting CSR to Certificate Authority...</div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'16px',flexWrap:'wrap'}}>
            {['👤 User','→','📋 CSR','→→→','🏛️ Certificate Authority'].map((n,i)=>(
              <div key={i} style={{
                padding:n.includes('→')?'0':'10px 16px',
                background:n.includes('→')?'transparent':i===4?'rgba(0,180,255,0.1)':'rgba(255,255,255,0.04)',
                border:n.includes('→')?'none':'1px solid rgba(0,180,255,0.2)',
                borderRadius:'8px',fontSize:'12px',fontWeight:'600',color:n.includes('→')?'var(--accent)':'var(--text-secondary)',
                animation:n==='→→→'?'pulse 0.5s infinite':'none'
              }}>{n}</div>
            ))}
          </div>
          <div style={{marginTop:'12px',fontSize:'12px',color:'var(--text-dim)'}}>Transmitting securely...</div>
        </div>
      )}

      {submitted && (
        <div className="card fade-in" style={{marginBottom:'20px',background:'rgba(0,230,118,0.04)',borderColor:'rgba(0,230,118,0.2)',textAlign:'center',padding:'20px'}}>
          <div style={{fontSize:'28px',marginBottom:'8px'}}>✅</div>
          <div style={{fontSize:'16px',fontWeight:'700',color:'var(--success)',marginBottom:'4px'}}>CSR Successfully Submitted to CA</div>
          <div style={{fontSize:'13px',color:'var(--text-dim)'}}>The Certificate Authority is now reviewing your request.</div>
        </div>
      )}

      {generated && csr && (
        <div style={{display:'flex',gap:'12px'}}>
          <button className="btn-primary" onClick={handleSubmit} disabled={animating}>
            {animating ? '⟳ Submitting...' : '🏛️ Submit CSR to CA'}
          </button>
          {submitted && (
            <button className="btn-secondary" onClick={()=>onNavigate('ca')}>Open CA Dashboard →</button>
          )}
        </div>
      )}

      <div className="info-panel" style={{marginTop:'20px'}}>
        <div style={{fontWeight:'600',color:'var(--accent)',marginBottom:'6px'}}>Why is a CSR required?</div>
        A CSR is the standard method for requesting a certificate from a CA. It includes your identity information and public key. The CA uses this to create your certificate. It is signed with your private key to prove you own the corresponding public key — a process called proof of possession.
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// PAGE: Certificate Authority
// ─────────────────────────────────────────────────────────────────────────────
function CAPage({ csr, onIssue, onComplete, onNavigate }) {
  const [step, setStep] = useState(-1);
  const [issued, setIssued] = useState(false);
  const [rejected, setRejected] = useState(false);

  const signingSteps = [
    {label:'CSR Received', icon:'📥', desc:'Certificate Signing Request received from applicant'},
    {label:'Identity Checked', icon:'🔍', desc:'Verifying applicant identity and domain ownership'},
    {label:'Public Key Verified', icon:'🔓', desc:'Validating submitted public key integrity'},
    {label:'Certificate Signed', icon:'✍️', desc:'Signing certificate with CA private key'},
    {label:'Certificate Issued', icon:'📜', desc:'Certificate sealed and ready for delivery'},
  ];

  const handleApprove = async () => {
    for (let i=0; i<signingSteps.length; i++) {
      setStep(i);
      await sleep(700);
    }
    setIssued(true);
    const cert = {
      cn: csr?.commonName || 'secure-demo.example',
      org: csr?.org || 'Secure Labs Inc.',
      country: csr?.country || 'IN',
      email: csr?.email || 'admin@example.com',
      issuer: 'PKI Learning Root CA',
      serial: genSerial(),
      validFrom: now(),
      validTo: addYear(now(), 1),
      fingerprint: genFingerprint(),
      sigAlg: 'SHA256withRSA',
      version: 'V3',
      keyUsage: 'Digital Signature, Key Encipherment',
      extKeyUsage: 'TLS Web Server Authentication',
      status: 'valid',
    };
    onIssue(cert);
    onComplete();
  };

  return (
    <div className="fade-in">
      <div className="page-header">
        <div className="page-eyebrow">STAGE 4 • TRUST ANCHOR</div>
        <div className="page-title">Certificate Authority Control Center</div>
        <div className="page-subtitle">The CA is the root of trust. It verifies identities and signs certificates, creating the foundation of PKI.</div>
      </div>

      {/* Root CA info */}
      <div className="cert-card" style={{marginBottom:'24px'}}>
        <div className="cert-header">
          <div className="cert-seal">🏛️</div>
          <div>
            <div style={{fontSize:'18px',fontWeight:'700',color:'var(--text-primary)'}}>PKI Learning Root CA</div>
            <div style={{fontSize:'12px',color:'var(--text-dim)'}}>Root Certificate Authority</div>
          </div>
          <div style={{marginLeft:'auto',textAlign:'right'}}>
            <span className="badge badge-success">✓ TRUSTED</span>
          </div>
        </div>
        <div className="cert-body">
          <div className="grid-3">
            {[
              {label:'CA Name',value:'PKI Learning Root CA'},
              {label:'Serial Number',value:genSerial().substring(0,17)+'...'},
              {label:'Valid From',value:'01 Jan 2025'},
              {label:'Valid Until',value:'01 Jan 2035'},
              {label:'Key Algorithm',value:'RSA-4096'},
              {label:'Status',value:'ACTIVE & TRUSTED'},
            ].map(f=>(
              <div key={f.label} style={{padding:'10px 0',borderBottom:'1px solid rgba(255,255,255,0.04)'}}>
                <div style={{fontSize:'11px',color:'var(--text-dim)',textTransform:'uppercase',letterSpacing:'0.5px'}}>{f.label}</div>
                <div style={{fontSize:'13px',color:'var(--text-secondary)',marginTop:'3px',fontFamily:'monospace'}}>{f.value}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Incoming request */}
      <div style={{fontSize:'15px',fontWeight:'600',marginBottom:'14px'}}>📥 Incoming Certificate Requests</div>

      {!csr ? (
        <div style={{background:'rgba(255,255,255,0.02)',border:'1px dashed var(--border)',borderRadius:'10px',padding:'32px',textAlign:'center',marginBottom:'20px'}}>
          <div style={{fontSize:'28px',marginBottom:'8px'}}>📋</div>
          <div style={{fontSize:'14px',color:'var(--text-dim)',marginBottom:'12px'}}>No pending requests. Submit a CSR first.</div>
          <button className="btn-secondary btn-sm" onClick={()=>onNavigate('csr')}>Go to CSR Lab →</button>
        </div>
      ) : (
        <div className="card" style={{marginBottom:'20px',borderColor:'rgba(255,170,0,0.2)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'16px'}}>
            <div>
              <div style={{fontSize:'12px',fontWeight:'700',color:'var(--warn)',letterSpacing:'1px'}}>REQUEST #PKI-001</div>
              <div style={{fontSize:'18px',fontWeight:'700',marginTop:'4px'}}>{csr.domain}</div>
            </div>
            {!issued && !rejected && step===-1 && <span className="badge badge-warn">PENDING REVIEW</span>}
            {issued && <span className="badge badge-success">APPROVED</span>}
            {rejected && <span className="badge badge-error">REJECTED</span>}
          </div>
          <div className="grid-3" style={{marginBottom:'16px'}}>
            {[
              {label:'Applicant',value:csr.commonName},
              {label:'Organization',value:csr.org},
              {label:'Country',value:csr.country},
              {label:'Email',value:csr.email},
              {label:'Public Key',value:'SHA256:'+csr.publicKeyFingerprint?.substring(0,16)+'...'},
              {label:'Submitted',value:new Date(csr.timestamp).toLocaleDateString()},
            ].map(f=>(
              <div key={f.label}>
                <div style={{fontSize:'11px',color:'var(--text-dim)',textTransform:'uppercase',letterSpacing:'0.5px'}}>{f.label}</div>
                <div style={{fontSize:'13px',color:'var(--text-secondary)',marginTop:'3px',fontFamily:f.label==='Public Key'?'monospace':'inherit',wordBreak:'break-all'}}>{f.value}</div>
              </div>
            ))}
          </div>

          {!issued && !rejected && step === -1 && (
            <div style={{display:'flex',gap:'10px'}}>
              <button className="btn-success" onClick={handleApprove}>✓ Approve Certificate</button>
              <button className="btn-danger" onClick={()=>setRejected(true)}>✕ Reject Certificate</button>
            </div>
          )}
        </div>
      )}

      {/* Signing animation */}
      {step >= 0 && !issued && (
        <div className="card fade-in" style={{marginBottom:'20px'}}>
          <div style={{fontSize:'14px',fontWeight:'600',color:'var(--accent)',marginBottom:'16px'}}>⟳ Certificate Signing Process</div>
          {signingSteps.map((s,i)=>(
            <div key={i} className="step-item">
              <div className={`step-icon ${i<step?'success':i===step?'pending':'idle'}`}>
                {i<step?'✓':i===step?'⟳':s.icon}
              </div>
              <div>
                <div style={{fontSize:'13px',fontWeight:'600',color:i===step?'var(--accent)':i<step?'var(--success)':'var(--text-dim)'}}>{s.label}</div>
                <div style={{fontSize:'12px',color:'var(--text-dim)'}}>{s.desc}</div>
              </div>
            </div>
          ))}
        </div>
      )}

      {issued && (
        <div className="card fade-in" style={{background:'rgba(0,230,118,0.04)',borderColor:'rgba(0,230,118,0.3)',padding:'24px',textAlign:'center',marginBottom:'20px'}}>
          <div style={{fontSize:'40px',marginBottom:'8px'}}>✅</div>
          <div style={{fontSize:'20px',fontWeight:'700',color:'var(--success)',marginBottom:'4px'}}>Certificate Successfully Issued</div>
          <div style={{fontSize:'13px',color:'var(--text-dim)',marginBottom:'16px'}}>The certificate has been signed by the CA and is ready to use.</div>
          <button className="btn-primary" onClick={()=>onNavigate('certificate')}>View Certificate →</button>
        </div>
      )}

      {rejected && (
        <div className="card fade-in" style={{background:'rgba(255,61,113,0.04)',borderColor:'rgba(255,61,113,0.3)',padding:'24px',textAlign:'center',marginBottom:'20px'}}>
          <div style={{fontSize:'40px',marginBottom:'8px'}}>❌</div>
          <div style={{fontSize:'18px',fontWeight:'700',color:'var(--error)',marginBottom:'4px'}}>Certificate Request Rejected</div>
          <div style={{fontSize:'13px',color:'var(--text-dim)',marginBottom:'16px'}}>The CA has rejected this certificate request. The applicant must resubmit with corrected information.</div>
          <button className="btn-secondary btn-sm" onClick={()=>{setRejected(false);}}>Review Again</button>
        </div>
      )}

      <ExplainBtn topic="ca" />
    </div>
  );
}

  const failureScenarios = {

      checks:[
        {id:'format',title:'Certificate Format',detail:'Format check passed',pass:true},
        {id:'issuer',title:'Issuer Verification',detail:'Issuer trusted',pass:true},
        {id:'expiry',title:'Expiration Check',detail:'Certificate expired on 01 Jan 2025. Current date is beyond expiry.',pass:false},
        {id:'signature',title:'Signature Verification',detail:'Skipped — certificate is already invalid',pass:null},
        {id:'domain',title:'Domain / Identity Check',detail:'Skipped',pass:null},
        {id:'chain',title:'Trust Chain Verification',detail:'Skipped',pass:null},
      ],
      reason:'Certificate Expired',
      explain:'The certificate\'s validity period has ended. PKI requires certificates to have an expiry date so compromised or outdated certificates are automatically rejected.',
      protection:'Expired certificates are rejected to prevent continued use of potentially compromised certificates. Renewal ensures certificates use current security parameters.'
    },
    unknownCA: {
      label:'Untrusted Certificate Authority',
      checks:[
        {id:'format',title:'Certificate Format',detail:'Format check passed',pass:true},
        {id:'issuer',title:'Issuer Verification',detail:'Issuer "Unknown CA Corp" is NOT in the trusted CA store',pass:false},
        {id:'expiry',title:'Expiration Check',detail:'Skipped — Issuer not trusted',pass:null},
        {id:'signature',title:'Signature Verification',detail:'Cannot verify without trusted CA',pass:null},
        {id:'domain',title:'Domain / Identity Check',detail:'Skipped',pass:null},
        {id:'chain',title:'Trust Chain Verification',detail:'Chain broken — Root CA not trusted',pass:null},
      ],
      reason:'Untrusted Certificate Authority',
      explain:'The certificate was issued by a CA that is not in the trusted CA store. This could indicate a self-signed certificate or a compromised CA.',

    domainMismatch: {
      label:'Domain Mismatch',
      checks:[
        {id:'format',title:'Certificate Format',detail:'Format check passed',pass:true},
        {id:'issuer',title:'Issuer Verification',detail:'Issuer trusted',pass:true},

        {id:'domain',title:'Domain / Identity Check',detail:'Expected: secure-demo.example. Certificate CN: evil-phishing.example — MISMATCH!',pass:false},
        {id:'chain',title:'Trust Chain Verification',detail:'Skipped — identity mismatch',pass:null},
      ],
      reason:'Domain Name Mismatch',
      explain:'The domain in the certificate does not match the domain being accessed. This is a common indicator of a man-in-the-middle attack.',
      protection:'Domain verification ensures that even if an attacker has a valid certificate, it cannot be used for a different domain than the one it was issued for.'
    },
    invalidSig: {
      label:'Invalid Digital Signature',
      checks:[
        {id:'format',title:'Certificate Format',detail:'Format check passed',pass:true},
        {id:'issuer',title:'Issuer Verification',detail:'Issuer CA found in trust store',pass:true},
        {id:'expiry',title:'Expiration Check',detail:'Within validity period',pass:true},
        {id:'signature',title:'Signature Verification',detail:'Signature verification FAILED — Certificate data may have been tampered with',pass:false},
        {id:'domain',title:'Domain / Identity Check',detail:'Skipped — signature invalid',pass:null},
        {id:'chain',title:'Trust Chain Verification',detail:'Skipped',pass:null},
      ],
      reason:'Invalid Digital Signature',
      explain:'The CA\'s digital signature on the certificate does not verify correctly. This means the certificate was tampered with after issuance.',
      protection:'The CA signs each certificate with its private key. Any modification to the certificate data causes signature verification to fail, detecting tampering.'
    },
    revoked: {
      label:'Revoked Certificate',
      checks:[
        {id:'format',title:'Certificate Format',detail:'Format check passed',pass:true},
        {id:'issuer',title:'Issuer Verification',detail:'Issuer trusted',pass:true},
        {id:'expiry',title:'Expiration Check',detail:'Within validity period',pass:true},
        {id:'signature',title:'Signature Verification',detail:'Signature valid',pass:true},
        {id:'domain',title:'Domain / Identity Check',detail:'Domain matches',pass:true},
        {id:'chain',title:'Trust Chain Verification',detail:'Certificate is on the Certificate Revocation List (CRL) — REVOKED!',pass:false},
      ],
      reason:'Certificate Revoked',
      explain:'The certificate has been revoked by the CA and appears on the Certificate Revocation List (CRL). This could be because the private key was compromised.',
      protection:'CRLs and OCSP allow CAs to invalidate certificates before their natural expiry date, preventing use of compromised certificates.'
    },
  };

  const runValidation = async (scenario=null) => {
    setRunning(true);
    setChecks([]);
    setResult(null);
    setFailureMode(scenario);
    const checkList = scenario ? failureScenarios[scenario].checks : validChecks;
    for (let i=0; i<checkList.length; i++) {
      setChecks(prev=>[...prev,{...checkList[i],state:'running'}]);
      await sleep(600);
      setChecks(prev=>prev.map((c,idx)=>idx===i?{...c,state:c.pass===null?'idle':c.pass?'pass':'fail'}:c));

        await sleep(300);
        break;

    setRunning(false);
    setResult(scenario ? 'fail' : 'pass');
    if (!scenario) { onComplete(); }

                <div style={{fontSize:'11px',color:'var(--text-dim)',marginTop:'2px'}}>{certificate?.cn || 'secure-demo.example'} • Issued by PKI Learning Root CA</div>
              </div>
            </div>
            <div style={{display:'flex',gap:'10px',flexWrap:'wrap'}}>
              <button className="btn-primary" onClick={()=>runValidation(null)} disabled={running}>
                {running && !failureMode ? '⟳ Validating...' : '▶ Validate Certificate'}
              </button>
            </div>
          </div>

          <div className="card">
            <div style={{fontSize:'13px',fontWeight:'600',color:'var(--warn)',marginBottom:'12px'}}>⚠️ Simulate Invalid Certificate</div>
            <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
              {Object.entries(failureScenarios).map(([key,s])=>(
                <button key={key} className="btn-secondary btn-sm" style={{textAlign:'left',borderColor:'rgba(255,170,0,0.25)'}} onClick={()=>runValidation(key)} disabled={running}>
                  ✕ {s.label}
                </button>
              ))}
            </div>
          </div>
        </div>

        {/* Checks */}
        <div>
          <div style={{fontSize:'13px',fontWeight:'600',color:'var(--accent)',marginBottom:'12px'}}>Validation Checks</div>
          {checks.length === 0 && (
            <div style={{padding:'40px',textAlign:'center',color:'var(--text-dim)',fontSize:'13px',background:'rgba(255,255,255,0.02)',border:'1px dashed var(--border)',borderRadius:'8px'}}>
              Click "Validate Certificate" to start the validation process

          )}
          {checks.map((c,i)=>(
            <div key={c.id+i} className={`check-item ${c.state}`}>

                {c.state==='running'?'⟳':c.state==='pass'?'✓':c.state==='fail'?'✕':'○'}
              </div>
              <div className="check-text">
                <div className="check-title">{i+1}. {c.title}</div>

          {result === 'pass' && (

function AuthPage({ certificate, onComplete, onNavigate }) {
  const [step, setStep] = useState(-1);
  const [done, setDone] = useState(false);
  const [explanations, setExplanations] = useState({});

  const authSteps = [
    {id:'cert',from:'client',to:'server',label:'Certificate Presented',desc:'Client sends its digital certificate to the server',internal:'Client retrieves certificate from local store and transmits to server',clientMsg:'→ Certificate',serverMsg:''},
    {id:'challenge',from:'server',to:'client',label:'Challenge Issued',desc:'Server generates a random challenge nonce',internal:'Server generates random 256-bit nonce: challenge = crypto.randomBytes(32)',clientMsg:'',serverMsg:'← Challenge'},
    {id:'signed',from:'client',to:'server',label:'Signed Response',desc:'Client signs the challenge with its private key',internal:'signedResponse = RSA_SIGN(challenge, clientPrivateKey)',clientMsg:'→ Signed Response',serverMsg:''},
    {id:'verify',from:'server',to:'client',label:'Verification',desc:'Server verifies the signature using the client\'s public key',internal:'valid = RSA_VERIFY(signedResponse, clientPublicKey)',clientMsg:'',serverMsg:'← Verified ✓'},
  ];

  const run = async () => {
    setStep(-1);
    setDone(false);
    for (let i=0; i<authSteps.length; i++) {
      setStep(i);
      await sleep(1200);
    }
    await sleep(400);
    setDone(true);
    onComplete();
  };

  return (
    <div className="fade-in">
      <div className="page-header">
        <div className="page-eyebrow">STAGE 7 • IDENTITY</div>
        <div className="page-title">Identity Authentication</div>
        <div className="page-subtitle">Watch how PKI enables certificate-based authentication between a client and server through a challenge-response protocol.</div>
      </div>

      {/* Auth diagram */}
      <div className="card" style={{marginBottom:'24px'}}>
        <div className="auth-flow" style={{gap:'24px'}}>
          {/* Client */}
          <div className="auth-box">
            <div className="auth-box-icon">💻</div>
            <div className="auth-box-title">CLIENT</div>
            <div style={{fontSize:'11px',color:'var(--text-dim)',marginTop:'4px'}}>{certificate?.cn||'secure-demo.example'}</div>
            {step>=0 && <div style={{marginTop:'8px'}}><span className="badge badge-info" style={{fontSize:'10px'}}>{authSteps[Math.min(step,3)].clientMsg||'Waiting...'}</span></div>}
          </div>

          {/* Channel */}
          <div className="auth-channel" style={{flex:1}}>
            {authSteps.map((s,i)=>(
              <div key={s.id} className={`auth-msg ${step===i?'active':''}`} style={{opacity:step>=i?1:0.2,transition:'all 0.4s'}}>
                {s.from==='client'?'CLIENT → SERVER':'SERVER → CLIENT'}: {s.label}
              </div>
            ))}
          </div>

          {/* Server */}
          <div className="auth-box">
            <div className="auth-box-icon">🖥️</div>
            <div className="auth-box-title">SERVER</div>
            <div style={{fontSize:'11px',color:'var(--text-dim)',marginTop:'4px'}}>secure-server.example</div>
            {step>=0 && <div style={{marginTop:'8px'}}><span className="badge badge-info" style={{fontSize:'10px'}}>{authSteps[Math.min(step,3)].serverMsg||'Processing...'}</span></div>}
          </div>
        </div>
      </div>

      {/* Step details */}
      {step >= 0 && (
        <div className="card" style={{marginBottom:'24px'}}>
          <div style={{fontSize:'13px',fontWeight:'600',color:'var(--accent)',marginBottom:'14px'}}>Step {step+1}: {authSteps[Math.min(step,3)].label}</div>
          {authSteps.map((s,i)=>(
            <div key={s.id} className="step-item">
              <div className={`step-icon ${i<step?'success':i===step?'pending':'idle'}`}>
                {i<step?'✓':i===step?'⟳':`${i+1}`}
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:'13px',fontWeight:'600',color:i===step?'var(--accent)':i<step?'var(--success)':'var(--text-dim)'}}>{s.label}</div>
                <div style={{fontSize:'12px',color:'var(--text-dim)'}}>{s.desc}</div>
                {i===step && (
                  <div style={{marginTop:'6px',padding:'6px 10px',background:'rgba(0,0,0,0.3)',borderRadius:'4px',fontFamily:'monospace',fontSize:'11px',color:'var(--accent)'}}>
                    {s.internal}
                  </div>
                )}
              </div>
              {i<=step && (
                <button className="explain-btn" onClick={()=>setExplanations(p=>({...p,[s.id]:!p[s.id]}))}>
                  ❓ Explain
                </button>
              )}
            </div>
          ))}
          {explanations[authSteps[Math.min(step,3)]?.id] && (
            <div className="explain-panel">
              {authSteps[Math.min(step,3)]?.id==='cert' && 'The client presents its digital certificate so the server knows who it is talking to. The certificate contains the client\'s public key and is signed by a trusted CA.'}
              {authSteps[Math.min(step,3)]?.id==='challenge' && 'The server sends a random challenge (nonce) that the client must sign. This prevents replay attacks — old signed messages cannot be reused.'}
              {authSteps[Math.min(step,3)]?.id==='signed' && 'The client uses its private key to create a digital signature of the challenge. Only the true private key holder can produce a valid signature.'}
              {authSteps[Math.min(step,3)]?.id==='verify' && 'The server uses the client\'s public key (from the certificate) to verify the signature. If valid, the client has proven they own the private key matching the certificate.'}
            </div>
          )}
        </div>
      )}

      {done && (
        <div className="card fade-in" style={{marginBottom:'20px',background:'rgba(0,230,118,0.04)',borderColor:'rgba(0,230,118,0.3)',padding:'24px',textAlign:'center'}}>
          <div style={{fontSize:'32px',marginBottom:'8px'}}>🛡️</div>
          <div style={{fontSize:'20px',fontWeight:'800',color:'var(--success)'}}>AUTHENTICATION VERIFIED</div>
          <div style={{fontSize:'13px',color:'var(--text-dim)',marginTop:'6px',marginBottom:'16px'}}>
            Identity of {certificate?.cn||'secure-demo.example'} has been cryptographically verified.
          </div>
          <div style={{display:'flex',gap:'8px',justifyContent:'center',flexWrap:'wrap'}}>
            <span className="badge badge-success">Certificate ✓</span>
            <span className="badge badge-success">Challenge ✓</span>
            <span className="badge badge-success">Signature ✓</span>
            <span className="badge badge-success">Identity ✓</span>
          </div>
        </div>
      )}

      <div style={{display:'flex',gap:'12px',flexWrap:'wrap'}}>
        <button className="btn-primary" onClick={run} disabled={step>=0&&!done}>
          {step>=0&&!done ? '⟳ Authenticating...' : done ? '↺ Run Again' : '▶ Start Authentication'}
        </button>
        {done && <button className="btn-secondary" onClick={()=>onNavigate('communication')}>Continue to Secure Comms →</button>}
      </div>
    </div>
  );
}

            <div style={{fontSize:'14px',fontWeight:'600',color:'var(--success)',marginBottom:'16px'}}>🔒 Secure Session Established — Send Encrypted Message</div>
            <div className="form-group">
              <label className="form-label">MESSAGE TO SEND</label>
              <input className="form-input" value={message} onChange={e=>setMessage(e.target.value)} placeholder="Enter a message..." />
            </div>
            <button className="btn-primary" onClick={sendMsg} disabled={sending}>
              {sending ? '⟳ Encrypting & Sending...' : '📤 Send Secure Message'}
            </button>

            {(sending || sent) && (
              <div style={{marginTop:'20px'}}>
                {[
                  {label:'Original Message',value:message,color:'var(--text-primary)',show:true},
                  {label:'Protected Message',value:sending?'Encrypting...':encryptFake(message),color:'var(--warn)',show:true},
                  {label:'Secure Transmission',value:'🔒 Transmitted over encrypted channel',color:'var(--accent)',show:!sending},
                  {label:'Server Receives',value:sending?'...':'✅ Message received and decrypted',color:'var(--success)',show:!sending},
                  {label:'Verified Message',value:sending?'...':message,color:'var(--success)',show:!sending},
                ].filter(s=>s.show).map((s,i)=>(
                  <div key={i} className="fade-in" style={{display:'flex',gap:'12px',alignItems:'flex-start',padding:'8px 0',borderBottom:'1px solid rgba(255,255,255,0.04)'}}>
                    <div style={{fontSize:'12px',color:'var(--text-dim)',width:'160px',flexShrink:0}}>{s.label}</div>
                    <div style={{fontSize:'12px',color:s.color,fontFamily:'monospace',wordBreak:'break-all'}}>{s.value}</div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <button className="btn-secondary" onClick={()=>onNavigate('management')}>Continue to Certificate Management →</button>
        </>
      )}

      <div className="info-panel" style={{marginTop:'20px'}}>
        ⚠️ This is a simplified educational representation of secure communication. Real TLS uses asymmetric cryptography to establish a symmetric session key. All values shown are simulated for learning purposes.
      </div>
    </div>
  );
}

// PAGE: Certificate Management
